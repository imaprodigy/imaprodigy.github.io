<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>you make me feel SPECIALLL</title>
<!-- Confetti library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root {
--bg1: #ffd6e7;
--bg2: #ffeef6;
--card: #ffffffcc;
--yes: #ff3b7a;
--yesHover: #ff1f68;
}
* { box-sizing: border-box; }
body {
margin: 0;
min-height: 100svh;
display: grid;
place-items: center;
background: radial-gradient(circle at top, var(--bg2), var(--bg1));
font-family: system-ui, sans-serif;
overflow: hidden;
padding: 16px;
}
/* FULL-SCREEN CONFETTI CANVAS */
#confettiCanvas {
position: fixed;
inset: 0;
width: 100vw;
height: 100vh;
pointer-events: none;
z-index: 9999;
}
.card {
width: min(720px, 92vw);
padding: 26px 22px;
background: var(--card);
backdrop-filter: blur(10px);
border-radius: 22px;
text-align: center;
box-shadow: 0 18px 60px rgba(0,0,0,.15);
}
.art {
width: min(260px, 80vw);
margin: 0 auto 10px;
display: block;
filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
}
h1 {
font-size: clamp(22px, 3vw, 44px);
margin: 12px 0 18px;
}
.button-zone {
position: relative;
width: min(520px, 92%);
height: 150px;
margin: 0 auto;
touch-action: none;
}
button {
position: absolute;
top: 50%;
transform: translateY(-50%);
padding: 16px 24px;
font-size: 18px;
font-weight: 800;
border-radius: 999px;
border: none;
cursor: pointer;
box-shadow: 0 10px 24px rgba(0,0,0,.14);
user-select: none;
-webkit-tap-highlight-color: transparent;
transition: transform .12s ease, background .12s ease;
}
#yesBtn {
left: 18%;
background: var(--yes);
color: #fff;
}
#yesBtn:hover { background: var(--yesHover); }
#noBtn {
left: 62%;
background: #e5e7eb;
color: #111827;
}
.hint {
margin-top: 10px;
font-size: 13px;
opacity: .7;
}
.result {
display: none;
margin-top: 18px;
animation: pop .35s ease;
}
.result h2 {
font-size: clamp(14px, calc(1rem + 2vw), 36px);
margin: 10px 0;
}
.fireworks {
width: min(380px, 90vw);
margin: 0 auto;
display: block;
}
@keyframes pop {
from { transform: scale(.96); opacity: 0; }
to { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<main class="card">
<!--PENGUIN-->
<svg class="art" width="150" height="180" viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
<!-- Body -->
<ellipse cx="150" cy="180" rx="100" ry="130" fill="#0b0b0b"/>
<!-- Belly -->
<ellipse cx="150" cy="200" rx="70" ry="90" fill="#ffffff"/>
<!-- Eyes (bigger & cuter) -->
<circle cx="120" cy="120" r="18" fill="#000"/>
<circle cx="180" cy="120" r="18" fill="#000"/>
<!-- Eye shine -->
<circle cx="114" cy="114" r="6" fill="#fff"/>
<circle cx="174" cy="114" r="6" fill="#fff"/>
<!-- Blush -->
<ellipse cx="100" cy="145" rx="12" ry="8" fill="#ff9bb5"/>
<ellipse cx="200" cy="145" rx="12" ry="8" fill="#ff9bb5"/>
<!-- Beak -->
<path d="M150 145 C140 150 140 165 150 170 C160 165 160 150 150 145" fill="#ff9f1c"/>
<!-- Arms -->
<ellipse cx="95" cy="210" rx="25" ry="45" fill="#0b0b0b"/>
<ellipse cx="205" cy="210" rx="25" ry="45" fill="#0b0b0b"/>
<!-- Heart -->
<path d="M150 210 C150 185 115 185 115 215 C115 245 150 265 150 285 C150 265 185 245 185 215 C185 185 150 185 150 210" fill="#ffb6c9"/>
<!-- Feet -->
<ellipse cx="120" cy="315" rx="20" ry="12" fill="#ff3b6f"/>
<ellipse cx="180" cy="315" rx="20" ry="12" fill="#ff3b6f"/>
</svg>
<h1>benji,
will you be my valentine?</h1>
<section class="button-zone" id="zone">
<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>
</section>
<!-- HINT -->
<div class="hint" id="hint">It might be "yes or yes" 😈</div>
<section class="result" id="result">
<h2>i love you and this beautiful little life we're building together.</h2>
<h2> you make me the happiest, my forever valentine -`♡´-</h2>
<img class="fireworks" src="https://github.com/user-attachments/assets/d36e2e77-c91d-4f5a-b71c-ddbfc729ac10" alt="Fireworks"/>
</section>
</main>
<script>
const zone = document.getElementById("zone");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const result = document.getElementById("result");
const hint = document.getElementById("hint");
/* ---------- CONFETTI ---------- */
const confettiCanvas = document.getElementById("confettiCanvas");
function resizeConfettiCanvas() {
const dpr = Math.max(1, window.devicePixelRatio || 1);
confettiCanvas.width = Math.floor(window.innerWidth * dpr);
confettiCanvas.height = Math.floor(window.innerHeight * dpr);
confettiCanvas.style.width = "100vw";
confettiCanvas.style.height = "100vh";
}
resizeConfettiCanvas();
window.addEventListener("resize", resizeConfettiCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));
const confettiInstance = confetti.create(confettiCanvas, {resize: false,useWorker: true});
function fullScreenConfetti() {
const end = Date.now() + 1600;
(function frame() {
confettiInstance({particleCount: 12,spread: 90,startVelocity: 45,ticks: 180,origin: { x: Math.random(), y: Math.random() * 0.3 }});
if (Date.now() < end) requestAnimationFrame(frame);
})();
setTimeout(() => {
confettiInstance({particleCount: 300,spread: 140,startVelocity: 60,ticks: 220,origin: { x: 0.5, y: 0.55 }});
}, 300);
}
/* ---------- YES BUTTON GROWS ---------- */
let yesScale = 1;
function growYes() {
yesScale = Math.min(2.2, yesScale + 0.1);
yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
}
/* ---------- NO BUTTON RUNS AWAY ---------- */
function clamp(n, min, max) {
return Math.max(min, Math.min(max, n));
}
function moveNo(px, py) {
const z = zone.getBoundingClientRect();
const b = noBtn.getBoundingClientRect();
let dx = (b.left + b.width / 2) - px;
let dy = (b.top + b.height / 2) - py;
let mag = Math.hypot(dx, dy) || 1;
dx /= mag;
dy /= mag;
let newLeft = (b.left - z.left) + dx * 150;
let newTop  = (b.top - z.top) + dy * 150;
newLeft = clamp(newLeft, 0, z.width - b.width);
newTop  = clamp(newTop, 0, z.height - b.height);
noBtn.style.left = newLeft + "px";
noBtn.style.top = newTop + "px";
noBtn.style.transform = "none";
growYes();
}
zone.addEventListener("pointermove", e => {
const b = noBtn.getBoundingClientRect();
const d = Math.hypot((b.left + b.width / 2) - e.clientX,(b.top + b.height / 2) - e.clientY);
if (d < 140) moveNo(e.clientX, e.clientY);
});

  noBtn.addEventListener("click", e => e.preventDefault());
  
/* ---------- YES CLICK ---------- */
yesBtn.addEventListener("click", () => {
zone.style.display = "none";
hint.style.display = "none"; // HIDE THE HINT
result.style.display = "block";
resizeConfettiCanvas();
fullScreenConfetti();
});
</script>
</body>
</html>
